<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
      body {
        background-image: url('../static/background.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        image-rendering: crisp-edges;
      }
    </style>

  </head>


  <body class="h-screen flex items-center justify-center">
    <div class="w-full max-w-sm p-10 rounded-2xl border border-purple-300/50 bg-purple-300/40 backdrop-blur-md shadow-xl">
      <h1 class="text-2xl font-semibold text-center text-white drop-shadow mb-6">
        Register
      </h1>
    <form method='POST' action="/register" class="flex flex-col space-y-4">
      <h1> Create &nbsp an &nbsp Account </h1>
      <p class="text-red-500 text-center text-sm">{{ error|safe }}</p>
      <p>
        USERNAME:
      </p>
      <input type="text" name="username" placeholder="Username"
        class="px-3 py-2 border border-white/40 text-white placeholder-white/70 rounded-lg bg-white/10 focus:ring-2 focus:ring-blue-300 focus:outline-none"
      >
      <br>
      <p> PASSWORD: </p>
      <input type="password" name="password" placeholder="Password"
        class="px-3 py-2 border border-white/40 text-white placeholder-white/70 rounded-lg bg-white/10 focus:ring-2 focus:ring-blue-300 focus:outline-none"
      >
      <br>
      <p> CONFIRM &nbsp PASSWORD: </p>
      <input type="password" name="confirm" placeholder="Confirm"
        class="px-3 py-2 border border-white/40 text-white placeholder-white/70 rounded-lg bg-white/10 focus:ring-2 focus:ring-blue-300 focus:outline-none"
      >
      <br><br>
      <button type="submit" value="Register" id= "sub1" name="sub1" class="bg-blue-600/80 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">
        Register
      </button>
    </form>
    <div class="text-center mt-4">
      <a class="text-white text-sm"> Have an Account? </a>
      <a href="/login" class="text-blue-200 hover:underline text-sm"> Login</a>
    </div>
  </body>
</html>
