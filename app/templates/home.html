<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

    <style>
      body, html {
        height: 100%;
        margin: 0;
        background-image: url('../static/background_blank.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        font-size: larger;
      }

      @font-face {
        font-family: myFont;
        src: url('../static/OldEnglishGothicPixelRegular-ow2Bo.ttf');
      }

      .custom-button {
        width: 400px;
        height: 100px;
      }

    </style>

  <body>
    
    <div class="d-flex align-items-center justify-content-center" style="flex-direction: column; height: 100vh;">
      <div>
        <form>
          <a href="{{ party }}" id="my-link"><img border="0" alt="profile" src="{{ image }}" width="100" height"100"></a>
        </form>
      </div>
      <div>
        <h1>Hello, {{ user }}!</h1>
      </div>
      <div>
        <form style="text-align: center" method='POST' action="/">
          <input style="text-align: center" class="width: 200px; height: 70px;" type="number" name="join code" required> 
        </br>
          <button class="btn btn-primary custom-button" type="submit" name="join" id="join"> Join </button>
        </form>
        </br>
        <form action="/create">
          <button class="btn btn-primary custom-button" type="submit" value="Host"> Host </button>
        </form>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
