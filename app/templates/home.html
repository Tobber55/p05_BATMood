<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOME</title>
    <script src="../static/js/home.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

  <body>
    <h1>Hello, {{ user }}!</h1>

    <div class="grid text-center" style="--bs-columns: 1;">

      <div class="container mx-auto d-flex justify-content-center" style="width: 200px;">
        <form method='POST' action="/">
          <input type="text" name="join code" required>
          <button class="btn btn-primary" type="submit" name="join" id="join"> Join </button>
        </form>
      </div>

      <div class="container mx-auto d-flex justify-content-center" style="width: 200px;">
        <form action="/create">
          <button class="btn btn-primary" type="submit" value="Host"> Host </button>
        </form>
      </div>

    </div>

    <form>
      <<a href="/login" id="profile"><img border="0" alt="profile" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fi.pinimg.com%2F474x%2Fae%2Fae%2F25%2Faeae25799b8763a924f5001c6297cf0e.jpg%3Fnii%3Dt&f=1&nofb=1&ipt=a463127ae3c71405a6bcaa6f8b2606c9fd3b859de74153d86a5c9dc2770e3e37" width="100" height"100"></a>
      <button id="change-btn">Change Link</button>
    </form>
    <!-- refer to home js -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
