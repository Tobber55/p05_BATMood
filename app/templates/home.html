<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

  <body>
    <h1>Hello, {{ user }}!</h1>

    <div class="grid text-center" style="--bs-columns: 1;">

      <div class="container mx-auto d-flex justify-content-center" style="width: 200px;">
        <form method='POST' action="/">
          <input type="text" name="join code" required>
          <button class="btn btn-primary" type="submit" name="join" id="join"> Join </button>
        </form>
      </div>

      <div class="container mx-auto d-flex justify-content-center" style="width: 200px;">
        <form action="/create">
          <button class="btn btn-primary" type="submit" value="Host"> Host </button>
        </form>
      </div>

    </div>

    <button id="profile-page"><img src="defaultpfp.jpg" class="img-responsive"></button>
    <!-- refer to home js -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
