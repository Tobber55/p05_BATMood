<!DOCTYPE html>
<html onmouseup="mouseUp()">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="../static/js/imposter.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <title>IMPOSTER</title>
    <script>
      var word = {{ word | tojson }};
      const socket = io();
      socket.emit("join_server", {{ g_id }});

      socket.on('reload', () => {
          window.location.reload();
      });
      </script>
    <div onmousedown="mouseDown(word)" class="card" style="width: 18rem; margin: auto">
      <div class="card-body">
        <h5 class="card-title">Category: {{ category }}</h5>
        <p id="role" class="card-text"></p>
      </div>
    </div>
  </head>
  <body>
    <div class="card" style="width: 18rem;">
      {%for i in range(0, lenPlayers)%}
        <div class="card" style="width: 18rem;">
          <div class="card-header">
            {{ players[i] }}
          </div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">An item</li>
            <li class="list-group-item">A second item</li>
            <li class="list-group-item">A third item</li>
          </ul>
        </div>
      {%endfor%}
    </div>
  </body>

</html>
