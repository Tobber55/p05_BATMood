<!DOCTYPE html>
<html onmouseup="mouseUp()">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="../static/js/imposter.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <title>IMPOSTER</title>
    <style>
      body, html {
        height: 100%;
        margin: 0;
        background-image: url('../static/background_blank.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
    </style>
    <script>
      var word = {{ word | tojson }};
      const socket = io();
      var inputLog ="";
      var turnN = 0;
      const player = "{{ playerN }}";
      const user = "{{ username }}";
      const playerM = "{{ playerM }}";
      const one = "{{ one }}"
      const two = "{{ two }}"
      const three = "{{ three }}"
      const four = "{{ four }}"
      const imp = "{{ imp }}"
      var onesus = 0
      var twosus = 0
      var threesus = 0
      var foursus = 0
      var voted = 0
      var confirmed = false
      var sus = 0
      window.addEventListener('beforeunload', (event) => {
          if (String(voted) != playerM){
            event.preventDefault();
            event.returnValue = '';
          }

      });

      if (player == "1"){
        socket.emit("joinGame", {{ g_id }});
      };
      socket.emit("join_server", {{ g_id }});

      socket.on('turn', function(turn){
        turnN = String(turn)
        var submit = document.getElementById('bleh');
        var html = `<div class="container mx-auto d-flex justify-content-center" style="width: 200px;">
      <input id="input" type="text" name="hint" required>
      <button onclick="input()" class="btn btn-primary" type="submit" name="submit_hint" id="submit_hint"> Submit </button>
    </div>`;
        if (player == turn){
          submit.innerHTML = html;
        } else{
          submit.innerHTML = "";
        }
      });

      socket.on('input', function(input){
        document.getElementById('bleh').innerHTML = "";
        inputLog = input
        var temp = inputLog.split("\\")
        var list = document.getElementById('clues');
        list.innerHTML = temp.map(item => `<li>${item}</li>`).join('');
      });

      function input(){
        var temp = document.getElementById('input').value;
        temp = temp.replaceAll("\\", "");
        temp = temp.slice(0, 21);
        temp = temp.replaceAll(word, "")
        inputLog = inputLog.concat(user);
        inputLog = inputLog.concat(": ");
        inputLog = inputLog.concat(temp);
        inputLog = inputLog.concat("\\");

        socket.emit("input", {{ g_id }}, String(inputLog));
        var current = parseInt("{{ playerN }}", 10)
        if (player == playerM){
          current = 1
        } else{
          current = current + 1
        }
        socket.emit("turn", {{ g_id }}, String(current))
      };

      </script>
    <div onmousedown="mouseDown(word)" class="card" style="width: 18rem; margin-right: auto; margin-left: auto; margin-bottom: 10vh;">
      <div class="card-body">
        <h5 class="card-title">Category: {{ category }} (Hold To Show)</h5>
        <p id="role" class="card-text"></p>
      </div>
    </div>
  </head>
  <body id="all">
    <div style="display: flex;">
      <div class="card" style="width: 18rem; margin: auto;">
        <div class="card" style="width: 18rem;">
          <div class="card-header" style="text-align: center;">
            Hint Log
          </div>
          <ul id="clues" class="list-group list-group-flush" style="list-style-type: none; margin: auto;"></ul>
        </div>
      </div>
      <div id="bleh" style="margin:auto;"></div>
      <script>
        if (player == "{{ playerF }}"){
          document.getElementById('bleh').innerHTML = `<div class="container mx-auto d-flex justify-content-center" style="width: 200px;">
          <input id="input" type="text" name="hint" required>
          <button onclick="input()" class="btn btn-primary" type="submit" name="submit_hint" id="submit_hint"> Submit </button>
          </div>`;
        };
      </script>
      <div class="card" style="width: 18rem; margin: auto;">
        <div class="card" style="width: 18rem;">
          <div class="card-header" style="text-align: center;">
            Who's Suspicious?
          </div>
          <div style="margin:auto;"><ul id="vote" class="list-group list-group-flush" style="margin: auto; list-style-type: none;"></ul></div>
        </div>
      </div>
      <script>
        function vote(player){
          if (!confirmed){
            if (sus == 1){onesus -= 1;}
            else if (sus == 2){twosus -= 1;}
            else if (sus == 3){threesus -= 1;}
            else if (sus == 4){foursus -= 1;}

            if (player == "1"){
              sus = 1;
              onesus += 1;
            }
            else if (player == "2"){
              sus = 2;
              twosus += 1;
            }
            else if (player == "3"){
              sus = 3;
              threesus += 1;
            }
            else if (player == "4"){
              sus = 4;
              foursus += 1;
            }
            socket.emit("vote", {{ g_id }}, {v: String(voted), one: String(onesus), two: String(twosus), three: String(threesus), four: String(foursus)});
          }
        };

        function confirm(){
          if (sus != 0){
            confirmed = true
            voted += 1
            socket.emit("vote", {{ g_id }}, {v: String(voted), one: String(onesus), two: String(twosus), three: String(threesus), four: String(foursus)});
          }
        }

        function updateVote(){
          document.getElementById("vote").innerHTML = ""
          if (one == user){document.getElementById("vote").innerHTML += `<li>${user}: ${onesus}</li>`}
          else if (two == user){document.getElementById("vote").innerHTML += `<li>${user}: ${twosus}</li>`}
          else if (three == user){document.getElementById("vote").innerHTML += `<li>${user}: ${threesus}</li>`}
          else if (four == user){document.getElementById("vote").innerHTML += `<li>${user}: ${foursus}</li>`}


          if (one != user && one != ""){
            document.getElementById("vote").innerHTML += `<li><button onclick="vote(1)" class="btn btn-primary">${one}</button>  ${onesus}</li>`
          }
          if (two != user && two != ""){
            document.getElementById("vote").innerHTML += `<li><button onclick="vote(2)" class="btn btn-primary">${two}</button>  ${twosus}</li>`
          }
          if (three != user && three != ""){
            document.getElementById("vote").innerHTML += `<li><button onclick="vote(3)" class="btn btn-primary">${three}</button>  ${threesus}</li>`
          }
          if (four != user && four != ""){
            document.getElementById("vote").innerHTML += `<li><button onclick="vote(4)" class="btn btn-primary">${four}</button>  ${foursus}</li>`
          }
          if (!confirmed){
            document.getElementById("vote").innerHTML += `<li><button onclick="confirm()" class="btn btn-secondary">CONFIRM VOTE</button></li>`
          }

          if (voted == parseInt(playerM, 10)){
            var max = Math.max(onesus, twosus, threesus, foursus)
            var bleh = true
            if (max == onesus && one == imp){bleh = (onesus == twosus || onesus == threesus || onesus == foursus)}
            else if (max == twosus && two == imp){bleh = (onesus == twosus || twosus == threesus || twosus == foursus)}
            else if (max == threesus && three == imp){bleh = (onesus == threesus || threesus == twosus || threesus == foursus)}
            else if (max == foursus && four == imp){bleh = (onesus == foursus || foursus == threesus || twosus == foursus)}

            socket.emit("gameEnd", {{ g_id }}, Boolean(bleh))
          }
        }

        function home(){
          window.location.href = '/';
        };

        socket.on('gameEnd', function(imp){
          if (imp){
            document.getElementById("all").innerHTML = `<div class="d-flex align-items-center justify-content-center" style="font-weight: bold; font-size: larger; flex-direction: column; height: 100vh;">
        <p> IMPOSTER WINS! </p>
        <button onclick="home()" class="btn btn-primary" type="submit"> Home </button>
    </div>`
            fetch('/game/{{ g_id }}', {
              method: "POST",
              body: JSON.stringify({
                imp: true
              }),
              headers: {
                "Content-type": "application/json; charset=UTF-8"
              }
            })
              .then((response) => response.json())
          } else{
            document.getElementById("all").innerHTML = `<div class="d-flex align-items-center justify-content-center" style="font-weight: bold; font-size: larger; flex-direction: column; height: 100vh;">
        <p> IMPOSTER WAS CAUGHT! </p>
        <button onclick="home()" class="btn btn-primary" type="submit"> Home </button>
    </div>`
            fetch('/game/{{ g_id }}', {
              method: "POST",
              body: JSON.stringify({
                imp: true
              }),
              headers: {
                "Content-type": "application/json; charset=UTF-8"
              }
            })
              .then((response) => response.json())
          }
        });

        socket.on('vote', function(data){
          onesus = parseInt(data.one, 10)
          twosus = parseInt(data.two, 10)
          threesus = parseInt(data.three, 10)
          foursus = parseInt(data.four, 10)
          voted = parseInt(data.v, 10)
          updateVote()
        });

        updateVote()

      </script>
    </div>
  </body>

</html>
