<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile - {{ username }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .profile-card { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 2rem; margin-top: 2rem; }
        .stat { text-align: center; padding: 20px; }
        .stat-number { font-size: 3rem; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 1.2rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <h1 class="text-center">{{ username }}</h1>
            <div class="row mt-4">
                <div class="col-md-6">
                    <div class="stat">
                        <div class="stat-number">{{ wins }}</div>
                        <div class="stat-label">Wins</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="stat">
                        <div class="stat-number">{{ losses }}</div>
                        <div class="stat-label">Losses</div>
                    </div>
                </div>
            </div>
            <div class="text-center mt-4">
                <a href="/" class="btn btn-primary">Back to Home</a>
                <a href="/logout" class="btn btn-danger">Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
